# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-transport-http"
version = "1.6.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version = "1.97"
description = "The http transport: request/response frames over tcp, and the http framer door."
license = "Apache-2.0"

[lib]
# rlib: the LINKED door. The dropped-in door is the sibling `busbar-transport-http-plugin` cdylib.
crate-type = ["rlib"]

# DEPENDENCY POLICY. A transport is a first-party plugin, reviewed rather than manifest-gated. `memchr` is the one
# non-plumbing name here: the framing scanners search for their terminators with it, and it is
# already in the lock through hyper's own tree, so naming it adds no crate to the graph.
#
# AND NO SIBLING TRANSPORT. This crate once declared `busbar-transport-tcp` and a `tls` transport
# crate (retired: TLS is core's connection security) and referenced neither in
# any of its source files: `listen`/`accept` bind their own socket through `tokio::net`, and this
# crate dials nothing (an upstream connection is the connector's, TLS included). Those names put a capability crate in the
# dependency closure of four plugin crates by two lines that compiled nothing (DECISIONS #40 — the
# wall is over the CLOSURE, and a transitive member is invisible in the manifest that causes it).
# What `http` composes over is still stated, but it is stated where it is true: `COMPOSES_OVER =
# &["tcp"]` in `meta.rs` is a declared wire fact the registry reads, and it needs no link edge to be
# true.
[dependencies]
memchr = "2"
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "0d2d6a5114204dbce3fdb39d7a0448691b70d8a3" }
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
# THE ACCEPTED SIDE (`door::accept`): hyper-util's auto server, as v1.5.5's data listener served
# (h2 by prior knowledge, HTTP/1.1 otherwise), driven over the host's bytes. No `tokio` feature: the
# executor and timer are the sans-IO drive's, so no runtime and no socket enter the closure.
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "http1", "http2", "service"] }
# The one-shot an accepted request's answer is handed to hyper's service through.
futures-channel = "0.3"
# The door's settings blob is JSON (`door::read_settings`).
serde_json = "1"
# THE ACCEPTED SIDE'S CREDENTIAL BYTES (`door::accept`): every buffer of this crate's own that held a
# request's credential lines (the bytes kept for a hand-over as sent, a held body) is zeroised
# before it is freed (`BUSBAR-1.6.0.md` §6 item 4: the plane never sees a credential). Already in
# the lock through `busbar-contract` (its SDK zeroises the auth handle's buffers): no crate is added.
zeroize = "1"

[dev-dependencies]
# THE 1.5.5 BYTE COMPARISON (`tests/h2_parity.rs`): 1.5.5's egress client, reqwest 0.12 with its
# `http2` feature, built exactly as 1.5.5 built it, captured beside this door on the same request.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
# THE REQUEST TARGET'S 1.5.5 BYTES (`door/tests`): the URL parser 1.5.5's client serialised
# every upstream path with, compared against the door's own encoder. Already in this list's closure
# through reqwest: no crate is added.
url = "2"
# The TEST-ONLY seal (#65). `busbar_contract::plugin::TestKernelSeal` is the one blessed
# fixture implementor of the SEALED `KernelSeal` trait; this crate's test harnesses used to
# forge their own. Dev-only and feature-gated, so it is absent from every release build.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "0d2d6a5114204dbce3fdb39d7a0448691b70d8a3", features = ["test-seal"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros"] }
# THE FAR END THAT READS THE HEAD (`door/tests`, ruling 23): an HTTP/2 server reading the door's
# own wire, so the cell compares the head the auth saw with every line a far end receives. Already
# in this lock through hyper's `http2` feature: no crate is added.
h2 = "0.4"
# THE ACCEPTED SIDE'S 1.5.5 BYTES (`door/tests/accept_tests.rs`): v1.5.5's exact server builder on a
# tokio duplex, compared against the door's answer bytes.
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "http1", "http2", "service", "tokio"] }
futures = "0.3"

