# RENDERED by `cargo xtask fleet render` from GetBusbar/busbar's plugins.yaml and .github/fleet/
# templates. cargo-deny policy for a first-party plugin: the license allowlist busbar's own deny.toml
# holds, and ONE reviewed git source (busbar itself, at the pin).
[advisories]
version = 2
ignore = [
    # RUSTSEC-2024-0449: `unsafe-libyaml` 0.2.11 is unmaintained. It reaches this plugin only through
    # busbar-contract at the pin (busbar-contract -> serde_yaml_ng 0.10 -> unsafe-libyaml), the same
    # line busbar's own Cargo.lock carries, and busbar's own deny.toml accepts it with this reason:
    # "unmaintained", not a security hole, and no safe swap exists now (a different YAML parser
    # risks 1.5.5 config-parse parity). Re-evaluate with busbar's row when serde_yaml_ng moves off
    # unsafe-libyaml. Tracking: https://rustsec.org/advisories/RUSTSEC-2024-0449.html
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/GetBusbar/busbar"]
