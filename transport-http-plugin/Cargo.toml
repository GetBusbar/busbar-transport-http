# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-transport-http-plugin"
version = "1.6.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:transport plugin cdylib: the `http` transport, packaged as a droppable busbar plugin. Drop the signed tarball into `plugins/` and the boot seal folds the wire beside the linked ones."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance tests load.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-transport-http = { path = "../transport-http" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "f7692e78e13e84ea9119c8251a9cf22b2a5497ea" }

[dev-dependencies]
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "f7692e78e13e84ea9119c8251a9cf22b2a5497ea" }
# door_both_ways.rs: a real hyper server on the far side of the framer, the cdylib dlopen'd.
libloading = "0.9"
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "http2", "server-auto", "server-graceful", "service", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros"] }
