# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-transport-http-plugin"
version = "1.6.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:transport plugin cdylib: the `http` transport, packaged as a droppable busbar plugin. Drop the signed tarball into `plugins/` and the boot seal folds the wire beside the linked ones."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance tests load.
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-transport-http = { path = "../transport-http" }
busbar-contract = { workspace = true }

[dev-dependencies]
busbar-plugin-loader = { workspace = true, features = ["conformance"] }
# door_both_ways.rs: a real hyper server on the far side of the framer, the cdylib dlopen'd.
libloading = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "io-util", "time", "macros"] }
