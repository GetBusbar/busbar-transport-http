# RENDERED by `cargo xtask fleet render busbar-transport-http` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. The CI itself is
# busbar's plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref).
name: ci

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@d6719cf2584e36df3c12bcf201f0b1bedeb2dc66
    with:
      service: none
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
      plugin_crate: busbar-transport-http-plugin
      plugin_kind: transport
      plugin_alias: http
    secrets: inherit
